<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Mundo Juntos</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/globe.gl"></script>
</head>
<body>

    <div id="anniversaryCard">
        <h1>Nuestro mundo, mi amorcito</h1>
        <svg class="heart-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <div id="counter">
            <div class="time-box">
                <span class="num" id="meses">0</span>
                <span class="label">Meses</span>
            </div>
            <div class="time-box">
                <span class="num" id="dias">0</span>
                <span class="label">Días</span>
            </div>
            <div class="time-box">
                <span class="num" id="horas">00</span>
                <span class="label">Hrs</span>
            </div>
            <div class="time-box">
                <span class="num" id="mins">00</span>
                <span class="label">Min</span>
            </div>
            <div class="time-box">
                <span class="num" id="segs">00</span>
                <span class="label">Seg</span>
            </div>
        </div>
    </div>
    <button id="toggleCounterBtn" onclick="toggleCounter()">Ocultar Contador</button>
    <<button id="toggleCounterBtn" onclick="toggleCounter()">Ocultar Contador</button>
    <button id="toggleCounterBtn" onclick="toggleCounter()">Ocultar Contador</button>
    <button id="musicBtn" onclick="toggleSpotify()">🎵 Mostrar Música</button>

    <div id="spotifyWidget" class="hidden">
        <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/6UKTAA5f7PE8pQN5kXDNVA?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
    <div id="globeViz"></div>

    <div id="galleryModal">
        <h2>Recuerdos</h2>
        <p>Vamos a construir más y más. Hasta que Dios nos de vida</p>
        
        <div class="carousel-container">
            <button class="nav-btn left" onclick="prevImage()">&#10094;</button>
            
            <div class="image-wrapper">
                <img id="carouselImage" src="" alt="Nuestro recuerdo">
                
                <div id="letterContainer" style="display: none;">
                    <div class="letter-content">
                        </div>
                </div>
                
                <div id="placeholderText" class="placeholder-text">Cargando recuerdos...</div>
            </div>

            <button class="nav-btn right" onclick="nextImage()">&#10095;</button>
        </div>
    </div>

    <div id="fullscreenModal">
        <img id="fullscreenImage" src="" alt="Imagen ampliada">
    </div>

    <script src="script.js"></script>
</body>
</html>
